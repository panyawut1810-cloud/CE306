<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter - โปรแกรมแปลงสกุลเงินสองทิศทาง</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom Scrollbar for History */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 8px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans flex flex-col justify-between p-4 sm:p-6">

  <!-- Main Container -->
  <main class="max-w-2xl mx-auto w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-8 my-auto space-y-6">
    
    <!-- Header & โจทย์ที่ 4: แสดงเวลาที่อัปเดตล่าสุด -->
    <header class="text-center space-y-2 border-b border-slate-100 pb-4">
      <h1 class="text-2xl sm:text-3xl font-black text-indigo-600 flex items-center justify-center gap-2">
        💱 โปรแกรมแปลงสกุลเงิน
      </h1>
      <!-- โจทย์ที่ 4 -->
      <p class="text-xs sm:text-sm font-medium text-slate-500 flex items-center justify-center gap-1">
        🕒 อัปเดตล่าสุด: <span id="lastUpdated" class="font-bold text-slate-700">กำลังโหลด...</span>
      </p>
    </header>

    <!-- Converter Section -->
    <section class="space-y-4">
      
      <!-- Amount One & Currency One -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="sm:col-span-2">
          <label for="amountOne" class="block text-xs font-bold text-slate-600 mb-1">จำนวนเงินต้นทาง (amount-one)</label>
          <input id="amountOne" type="number" placeholder="0.00" min="0" step="any"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>
        <div>
          <label for="currencyOne" class="block text-xs font-bold text-slate-600 mb-1">สกุลเงินต้นทาง</label>
          <select id="currencyOne" class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
            <option value="USD">USD - สหรัฐฯ</option>
            <option value="THB" selected>THB - ไทย</option>
            <option value="EUR">EUR - ยูโร</option>
            <option value="JPY">JPY - ญี่ปุ่น</option>
            <option value="GBP">GBP - อังกฤษ</option>
          </select>
        </div>
      </div>

      <!-- Swap Icon & Exchange Rate Display -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-2 py-2">
        <button id="swapBtn" type="button" title="สลับสกุลเงิน"
          class="p-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-full transition-all active:scale-95 shadow-sm">
          🔄 สลับ
        </button>
        <div id="rateDisplay" class="text-xs sm:text-sm font-semibold text-slate-500 text-center sm:text-right">
          อัตราแลกเปลี่ยน: 1 THB = ... USD
        </div>
      </div>

      <!-- Amount Two & Currency Two -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="sm:col-span-2">
          <label for="amountTwo" class="block text-xs font-bold text-slate-600 mb-1">จำนวนเงินปลายทาง (amount-two)</label>
          <input id="amountTwo" type="number" placeholder="0.00" min="0" step="any"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        </div>
        <div>
          <label for="currencyTwo" class="block text-xs font-bold text-slate-600 mb-1">สกุลเงินปลายทาง</label>
          <select id="currencyTwo" class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
            <option value="USD" selected>USD - สหรัฐฯ</option>
            <option value="THB">THB - ไทย</option>
            <option value="EUR">EUR - ยูโร</option>
            <option value="JPY">JPY - ญี่ปุ่น</option>
            <option value="GBP">GBP - อังกฤษ</option>
          </select>
        </div>
      </div>

      <!-- โจทย์ที่ 3: ปุ่มล้างข้อมูล -->
      <div class="pt-2">
        <button id="resetBtn" type="button"
          class="w-full py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-2xl text-xs sm:text-sm transition-all active:scale-98">
          🗑️ ล้างข้อมูล
        </button>
      </div>
    </section>

    <!-- โจทย์ที่ 2: ประวัติการแปลงเงิน -->
    <section class="border-t border-slate-100 pt-5 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-extrabold text-slate-700 flex items-center gap-1.5">
          📜 ประวัติการแปลงเงินย้อนหลัง (10 รายการล่าสุด)
        </h2>
        <button id="clearHistoryBtn" type="button"
          class="text-xs font-bold text-rose-500 hover:text-rose-600 hover:underline transition-all">
          ล้างประวัติ
        </button>
      </div>

      <!-- History List Display -->
      <ul id="historyList" class="custom-scrollbar max-h-48 overflow-y-auto space-y-2 pr-1 text-xs sm:text-sm">
        <li class="text-center py-4 text-slate-400 font-medium italic">ยังไม่มีประวัติการแปลงเงิน</li>
      </ul>
    </section>

  </main>

  <footer class="text-center text-xs font-bold text-slate-400 pb-2">
    Assignment 2 - Two-way Currency Converter App
  </footer>

  <!-- Application Logic JavaScript -->
  <script>
    // Elements
    const amountOne = document.getElementById('amountOne');
    const amountTwo = document.getElementById('amountTwo');
    const currencyOne = document.getElementById('currencyOne');
    const currencyTwo = document.getElementById('currencyTwo');
    const rateDisplay = document.getElementById('rateDisplay');
    const lastUpdated = document.getElementById('lastUpdated');
    const swapBtn = document.getElementById('swapBtn');
    const resetBtn = document.getElementById('resetBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const historyList = document.getElementById('historyList');

    // App State
    let rates = {};
    let history = [];
    let historyTimeout = null;

    // Fetch Rates & Last Updated Time (โจทย์ที่ 4)
    async function fetchRates() {
      try {
        const response = await fetch('https://open.er-api.com/v6/latest/USD');
        const data = await response.json();
        
        rates = data.rates;

        // แสดงเวลาอัปเดตล่าสุด
        const updateDate = new Date(data.time_last_update_utc);
        lastUpdated.textContent = updateDate.toLocaleString('th-TH', {
          dateStyle: 'medium',
          timeStyle: 'medium'
        });

        updateRatesDisplay();
      } catch (error) {
        lastUpdated.textContent = 'ไม่สามารถดึงข้อมูลเวลาได้';
        rateDisplay.textContent = 'เกิดข้อผิดพลาดในการโหลดอัตราแลกเปลี่ยน';
      }
    }

    // Update Exchange Rate Text State
    function updateRatesDisplay() {
      const curr1 = currencyOne.value;
      const curr2 = currencyTwo.value;

      if (rates[curr1] && rates[curr2]) {
        const rate = (rates[curr2] / rates[curr1]).toFixed(4);
        rateDisplay.textContent = `อัตราแลกเปลี่ยน: 1 ${curr1} = ${rate} ${curr2}`;
      } else {
        rateDisplay.textContent = 'กำลังโหลดอัตราแลกเปลี่ยน...';
      }
    }

    // โจทย์ที่ 1: แปลงค่าจาก ช่อง 1 -> ช่อง 2 (Two-Way Direction A)
    function calculateFromOne() {
      const val = parseFloat(amountOne.value);
      const curr1 = currencyOne.value;
      const curr2 = currencyTwo.value;

      if (isNaN(val) || val <= 0) {
        amountTwo.value = '';
        return;
      }

      if (rates[curr1] && rates[curr2]) {
        const result = (val * (rates[curr2] / rates[curr1])).toFixed(2);
        amountTwo.value = result;
        debounceSaveHistory(`${val.toLocaleString()} ${curr1} → ${parseFloat(result).toLocaleString()} ${curr2}`);
      }
    }

    // โจทย์ที่ 1: แปลงค่าจาก ช่อง 2 -> ช่อง 1 ย้อนกลับ (Two-Way Direction B)
    function calculateFromTwo() {
      const val = parseFloat(amountTwo.value);
      const curr1 = currencyOne.value;
      const curr2 = currencyTwo.value;

      if (isNaN(val) || val <= 0) {
        amountOne.value = '';
        return;
      }

      if (rates[curr1] && rates[curr2]) {
        const result = (val * (rates[curr1] / rates[curr2])).toFixed(2);
        amountOne.value = result;
        debounceSaveHistory(`${val.toLocaleString()} ${curr2} ← ${parseFloat(result).toLocaleString()} ${curr1}`);
      }
    }

    // โจทย์ที่ 2: บันทึกประวัติการแปลงเงินย้อนหลังสูงสุด 10 รายการ
    function saveHistory(itemText) {
      // ป้องกันการบันทึกรายการซ้ำเดิมติดๆ กัน
      if (history.length > 0 && history[0] === itemText) return;

      history.unshift(itemText);
      if (history.length > 10) history.pop(); // เก็บย้อนหลังไม่เกิน 10 รายการ

      renderHistory();
    }

    function debounceSaveHistory(itemText) {
      clearTimeout(historyTimeout);
      historyTimeout = setTimeout(() => {
        saveHistory(itemText);
      }, 800); // รอพิมพ์จบ 0.8 วินาทีแล้วค่อยลงประวัติ
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = `<li class="text-center py-4 text-slate-400 font-medium italic">ยังไม่มีประวัติการแปลงเงิน</li>`;
        return;
      }

      historyList.innerHTML = history.map((item, index) => `
        <li class="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-100 rounded-xl font-bold text-slate-700">
          <span class="text-xs font-bold text-indigo-500 w-6">#${index + 1}</span>
          <span class="flex-1 text-center font-extrabold">${item}</span>
        </li>
      `).join('');
    }

    // โจทย์ที่ 3: ปุ่มล้างข้อมูล (Clear / Reset Inputs & Rate State)
    function resetData() {
      amountOne.value = '';
      amountTwo.value = '';
      currencyOne.value = 'THB';
      currencyTwo.value = 'USD';
      updateRatesDisplay();
    }

    // Event Listeners
    amountOne.addEventListener('input', calculateFromOne);
    amountTwo.addEventListener('input', calculateFromTwo);

    currencyOne.addEventListener('change', () => {
      updateRatesDisplay();
      if (amountOne.value) calculateFromOne();
    });

    currencyTwo.addEventListener('change', () => {
      updateRatesDisplay();
      if (amountOne.value) calculateFromOne();
    });

    swapBtn.addEventListener('click', () => {
      const tempCurr = currencyOne.value;
      currencyOne.value = currencyTwo.value;
      currencyTwo.value = tempCurr;
      
      updateRatesDisplay();
      if (amountOne.value) calculateFromOne();
    });

    resetBtn.addEventListener('click', resetData);

    clearHistoryBtn.addEventListener('click', () => {
      history = [];
      renderHistory();
    });

    // Initialize App
    fetchRates();
  </script>
</body>
</html>
