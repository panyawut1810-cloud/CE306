<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 2 - Currency Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 flex flex-col items-center">

  <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">โปรแกรมแปลงสกุลเงิน</h1>

    <!-- โจทย์ที่ 4: แสดงเวลาที่อัปเดตล่าสุด -->
    <div id="last-updated" class="text-xs text-center text-gray-500 mb-6 bg-gray-50 p-2 rounded-lg">
      เวลาที่อัปเดตล่าสุด: -
    </div>

    <!-- ช่องเงินต้นทาง -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">ต้นทาง</label>
      <div class="flex gap-2">
        <select id="currency-one" class="border border-gray-300 rounded-lg p-2 bg-white">
          <option value="USD">USD</option>
          <option value="THB" selected>THB</option>
          <option value="EUR">EUR</option>
          <option value="JPY">JPY</option>
        </select>
        <input type="number" id="amount-one" placeholder="0.00" class="border border-gray-300 rounded-lg p-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
    </div>

    <!-- ปุ่มสลับสกุลเงิน -->
    <div class="flex justify-center mb-4">
      <button id="swap-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 p-2 rounded-full transition">
        🔄 สลับสกุลเงิน
      </button>
    </div>

    <!-- ช่องเงินปลายทาง -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">ปลายทาง</label>
      <div class="flex gap-2">
        <select id="currency-two" class="border border-gray-300 rounded-lg p-2 bg-white">
          <option value="USD" selected>USD</option>
          <option value="THB">THB</option>
          <option value="EUR">EUR</option>
          <option value="JPY">JPY</option>
        </select>
        <!-- โจทย์ที่ 1: รับค่า amount-two -->
        <input type="number" id="amount-two" placeholder="0.00" class="border border-gray-300 rounded-lg p-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
    </div>

    <!-- อัตราแลกเปลี่ยนปัจจุบัน -->
    <div id="rate-info" class="text-sm font-medium text-blue-600 text-center mb-6">
      1 THB = 0.028 USD
    </div>

    <!-- โจทย์ที่ 3: ปุ่มล้างข้อมูล -->
    <button id="clear-btn" class="w-full bg-red-500 hover:bg-red-600 text-white font-medium py-2 rounded-lg transition mb-6">
      ล้างข้อมูล (Reset)
    </button>

    <!-- โจทย์ที่ 2: ประวัติการแปลงเงิน -->
    <div class="border-t pt-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold text-gray-700">ประวัติการแปลงเงิน (10 รายการล่าสุด)</h2>
        <button id="clear-history-btn" class="text-xs text-red-500 hover:underline">
          ล้างประวัติ
        </button>
      </div>
      <ul id="history-list" class="space-y-2 text-sm text-gray-600 max-h-48 overflow-y-auto">
        <li class="text-gray-400 text-center py-2">ยังไม่มีประวัติการแปลงเงิน</li>
      </ul>
    </div>
  </div>

  <script>
    // อัตราแลกเปลี่ยนสมมติเทียบกับ 1 USD (สามารถเปลี่ยนเป็น API จริงได้)
    const rates = {
      USD: 1,
      THB: 35.5,
      EUR: 0.92,
      JPY: 155.0
    };

    const currencyOne = document.getElementById('currency-one');
    const amountOne = document.getElementById('amount-one');
    const currencyTwo = document.getElementById('currency-two');
    const amountTwo = document.getElementById('amount-two');
    const rateInfo = document.getElementById('rate-info');
    const lastUpdated = document.getElementById('last-updated');
    const clearBtn = document.getElementById('clear-btn');
    const swapBtn = document.getElementById('swap-btn');
    const historyList = document.getElementById('history-list');
    const clearHistoryBtn = document.getElementById('clear-history-btn');

    let historyData = [];

    // โจทย์ที่ 4: ฟังก์ชันอัปเดตเวลาปัจจุบัน
    function updateTimestamp() {
      const now = new Date();
      const timeString = now.toLocaleString('th-TH', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      lastUpdated.innerText = `เวลาที่อัปเดตล่าสุด: ${timeString}`;
    }

    // ฟังก์ชันคำนวณอัตราแลกเปลี่ยนระหว่าง 2 สกุลเงิน
    function getRate(from, to) {
      return (rates[to] / rates[from]);
    }

    // แสดงข้อมูลอัตราแลกเปลี่ยนปัจจุบัน
    function updateRateText() {
      const rate = getRate(currencyOne.value, currencyTwo.value);
      rateInfo.innerText = `1 ${currencyOne.value} = ${rate.toFixed(4)} ${currencyTwo.value}`;
    }

    // โจทย์ที่ 1: แปลงจาก ต้นทาง -> ปลายทาง
    function calculateFromOne() {
      if (amountOne.value === '' || amountOne.value <= 0) {
        amountTwo.value = '';
        return;
      }
      const rate = getRate(currencyOne.value, currencyTwo.value);
      const result = (parseFloat(amountOne.value) * rate).toFixed(2);
      amountTwo.value = result;
      
      updateTimestamp();
      addHistory(amountOne.value, currencyOne.value, result, currencyTwo.value);
    }

    // โจทย์ที่ 1: แปลงย้อนกลับจาก ปลายทาง -> ต้นทาง (amount-two)
    function calculateFromTwo() {
      if (amountTwo.value === '' || amountTwo.value <= 0) {
        amountOne.value = '';
        return;
      }
      const rate = getRate(currencyTwo.value, currencyOne.value);
      const result = (parseFloat(amountTwo.value) * rate).toFixed(2);
      amountOne.value = result;

      updateTimestamp();
      addHistory(result, currencyOne.value, amountTwo.value, currencyTwo.value);
    }

    // โจทย์ที่ 2: บันทึกและแสดงประวัติย้อนหลังสูงสุด 10 รายการ
    function addHistory(val1, curr1, val2, curr2) {
      const record = `${parseFloat(val1).toLocaleString()} ${curr1} → ${parseFloat(val2).toLocaleString()} ${curr2}`;
      
      // ป้องกันการเพิ่มรายการซ้ำกรณีพิมพ์ค้างไว้
      if (historyData.length > 0 && historyData[0] === record) return;

      historyData.unshift(record); // เพิ่มไว้บนสุด
      if (historyData.length > 10) historyData.pop(); // ตัดรายการที่เกิน 10 ออก

      renderHistory();
    }

    function renderHistory() {
      if (historyData.length === 0) {
        historyList.innerHTML = '<li class="text-gray-400 text-center py-2">ยังไม่มีประวัติการแปลงเงิน</li>';
        return;
      }

      historyList.innerHTML = historyData
        .map(item => `<li class="bg-gray-50 p-2 rounded-lg flex justify-between border border-gray-100">
          <span>${item}</span>
        </li>`)
        .join('');
    }

    // โจทย์ที่ 3: ปุ่มล้างข้อมูล Input และรีเซ็ตสถานะ
    clearBtn.addEventListener('click', () => {
      amountOne.value = '';
      amountTwo.value = '';
      currencyOne.value = 'THB';
      currencyTwo.value = 'USD';
      updateRateText();
      updateTimestamp();
    });

    // ปุ่มล้างประวัติการแปลงเงิน
    clearHistoryBtn.addEventListener('click', () => {
      historyData = [];
      renderHistory();
    });

    // ปุ่มสลับสกุลเงิน
    swapBtn.addEventListener('click', () => {
      const temp = currencyOne.value;
      currencyOne.value = currencyTwo.value;
      currencyTwo.value = temp;
      updateRateText();
      calculateFromOne();
    });

    // Event Listeners สำหรับตรวจจับการกรอกข้อมูลและการเปลี่ยนสกุลเงิน
    amountOne.addEventListener('input', calculateFromOne);
    amountTwo.addEventListener('input', calculateFromTwo);
    currencyOne.addEventListener('change', () => { updateRateText(); calculateFromOne(); });
    currencyTwo.addEventListener('change', () => { updateRateText(); calculateFromOne(); });

    // ค่าเริ่มต้นเมื่อโหลดหน้าเว็บ
    updateRateText();
    updateTimestamp();
  </script>

</body>
</html>
